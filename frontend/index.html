<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Dashboard - Sistema Inventario</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="sidebar">
  <h4>📦 Inventario</h4>
  <a href="index.html"><i class="fa fa-tachometer-alt"></i> Dashboard</a>
  <a href="formulario.html"><i class="fa fa-pen"></i> Captura</a>
  <a href="consultas.html"><i class="fa fa-table"></i> Consultas</a>
</div>

<div class="content">

<h3 class="mb-4"><i class="fa fa-tachometer-alt"></i> Dashboard</h3>

<!-- KPIs -->
<div class="row mb-4">
  <div class="col-md-3">
    <div class="stat-card">
      <h5><i class="fa fa-box"></i> Productos</h5>
      <h3 id="totalProductos">0</h3>
    </div>
  </div>
  <div class="col-md-3">
    <div class="stat-card">
      <h5><i class="fa fa-exchange-alt"></i> Movimientos</h5>
      <h3 id="totalMovimientos">0</h3>
    </div>
  </div>
  <div class="col-md-3">
    <div class="stat-card">
      <h5><i class="fa fa-exclamation-triangle"></i> Alertas</h5>
      <h3 id="totalAlertas">0</h3>
    </div>
  </div>
  <div class="col-md-3">
    <div class="stat-card">
      <h5><i class="fa fa-building"></i> Servidor</h5>
      <h3 id="servidorActivo">A</h3>
    </div>
  </div>
</div>

<!-- Alertas de Stock Bajo y Últimos Movimientos -->
<div class="row">
  <div class="col-md-6">
    <div class="card p-3">
      <h4 class="mb-3"><i class="fa fa-exclamation-triangle text-warning"></i> Stock Bajo</h4>
      <ul id="alertasList" class="list-group">
        <li class="list-group-item bg-dark text-muted">Cargando...</li>
      </ul>
    </div>
  </div>
  
  <div class="col-md-6">
    <div class="card p-3">
      <h4 class="mb-3"><i class="fa fa-history"></i> Últimos Movimientos</h4>
      <div class="table-responsive">
        <table class="table table-sm">
          <thead>
            <tr><th>Fecha</th><th>Tipo</th><th>Almacén</th><th>Usuario</th><th>Cantidad</th></tr>
          </thead>
          <tbody id="ultimosMovimientos">
            <tr><td colspan="5" class="text-muted">Cargando......</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Selector de Servidor Manual -->
<div class="row mt-4">
  <div class="col-md-12">
    <div class="card p-3">
      <h4 class="mb-3"><i class="fa fa-database"></i> Conexión a Servidores</h4>
      <div class="row align-items-center">
        <div class="col-md-4">
          <select id="selectorServidor" class="form-control">
            <option value="A">☁️ Supabase A (Almacén Central)</option>
            <option value="B">☁️ Supabase B (Almacén Norte)</option>
            <option value="local">💻 PostgreSQL Local (Respaldo)</option>
          </select>
        </div>
        <div class="col-md-8">
          <div id="servidoresStatus" class="d-flex gap-3">
            <span class="badge bg-secondary">Verificando...</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Botón Sincronización Manual -->
<div class="row mt-3">
  <div class="col-md-12">
    <button id="btnSincronizar" class="btn btn-warning">
      <i class="fa fa-sync"></i> Sincronizar Ahora
    </button>
  </div>
</div>

</div>

<script src="js/api.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
