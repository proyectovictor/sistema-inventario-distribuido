<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Login - Sistema Inventario</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<style>
    body {
        background: linear-gradient(135deg, #0f172a, #020617);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Segoe UI', sans-serif;
    }
    .login-card {
        background: #111827;
        border-radius: 20px;
        padding: 40px;
        width: 100%;
        max-width: 400px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .login-card h2 {
        color: white;
        text-align: center;
        margin-bottom: 30px;
    }
    .login-card .input-group-text {
        background: #020617;
        border: 1px solid #374151;
        color: #9ca3af;
    }
    .login-card input {
        background: #020617 !important;
        border: 1px solid #374151 !important;
        color: white !important;
    }
    .login-card input:focus {
        border-color: #3b82f6 !important;
        box-shadow: 0 0 8px #3b82f6;
    }
    .btn-login {
        background: linear-gradient(135deg, #2563eb, #1d4ed8);
        border: none;
        width: 100%;
        padding: 12px;
        font-weight: bold;
    }
</style>
</head>
<body>
<div class="login-card">
    <h2><i class="fa fa-box"></i> Inventario</h2>
    <form id="loginForm">
        <div class="mb-3">
            <div class="input-group">
                <span class="input-group-text"><i class="fa fa-user"></i></span>
                <input type="text" id="username" class="form-control" placeholder="Usuario" required>
            </div>
        </div>
        <div class="mb-3">
            <div class="input-group">
                <span class="input-group-text"><i class="fa fa-lock"></i></span>
                <input type="password" id="password" class="form-control" placeholder="Contraseña" required>
            </div>
        </div>
        <button type="submit" class="btn btn-primary btn-login">
            <i class="fa fa-sign-in-alt"></i> Iniciar Sesión
        </button>
        <div id="mensaje" class="alert alert-danger mt-3" style="display: none;"></div>
    </form>
    <div class="text-center mt-3 text-muted small">
        <p>Usuarios de prueba:</p>
        <p><strong>admin</strong> / admin123 (acceso total)<br>
        <strong>carlos.lopez</strong> / carlos2026 (Sucursal A)<br>
        <strong>laura.martinez</strong> / laura2026 (Sucursal B)</p>
    </div>
</div>

<script>
const API_BASE_URL = 'http://localhost/sistema-inventario-distribuido/backend';

document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    const mensajeDiv = document.getElementById('mensaje');
    
    mensajeDiv.style.display = 'none';
    
    try {
        const response = await fetch(`${API_BASE_URL}/login.php`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });
        
        const data = await response.json();
        
        if (data.success) {
            localStorage.setItem('token', data.token);
            localStorage.setItem('usuario', JSON.stringify(data.usuario));
            window.location.href = 'index.html';
        } else {
            mensajeDiv.textContent = data.error || 'Error al iniciar sesión';
            mensajeDiv.style.display = 'block';
        }
    } catch (error) {
        mensajeDiv.textContent = 'Error de conexión: ' + error.message;
        mensajeDiv.style.display = 'block';
    }
});
</script>
</body>
</html>
