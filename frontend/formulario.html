<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Captura</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>

<body>

<div class="sidebar">
  <h4>📦 Inventario</h4>
  <a href="formulario.html"><i class="fa fa-pen"></i> Captura</a>
  <a href="consultas.html"><i class="fa fa-table"></i> Consultas</a>
</div>

<div class="content">

<h3 class="mb-4"> - Captura</h3>

<!-- STATS DINÁMICOS -->
<div class="row mb-4">

  <div class="col-md-4">
    <div class="stat-card">
      <h5>Movimientos</h5>
      <h3 id="movimientos">0</h3>
    </div>
  </div>

  <div class="col-md-4">
    <div class="stat-card">
      <h5>Productos</h5>
      <h3 id="productos">0</h3>
    </div>
  </div>

  <div class="col-md-4">
    <div class="stat-card">
      <h5>Alertas</h5>
      <h3 id="alertas">0</h3>
    </div>
  </div>

</div>

<div class="card p-4">

<h4 class="mb-4 text-white">Registrar Movimiento</h4>

<form id="formMovimiento">

<div class="row g-3">

<!-- SUCURSAL -->
<div class="col-md-6">
<div class="input-group">
<span class="input-group-text"><i class="fa fa-building"></i></span>
<select id="sucursal" class="form-control">
<option value="">Sucursal</option>
<option>A</option>
<option>B</option>
</select>
</div>
</div>

<!-- TIPO -->
<div class="col-md-6">
<div class="input-group">
<span class="input-group-text"><i class="fa fa-exchange-alt"></i></span>
<select id="tipo" class="form-control">
<option value="">Tipo</option>
<option>Entrada</option>
<option>Salida</option>
</select>
</div>
</div>

<!-- PRODUCTO CON AUTOCOMPLETE 🔥 -->
<div class="col-md-6 position-relative">
  <div class="input-group">
    <span class="input-group-text"><i class="fa fa-box"></i></span>
    <input type="text" id="producto" class="form-control" placeholder="Buscar producto...">
  </div>

  <div id="sugerencias" class="autocomplete-box"></div>
</div>

<!-- CANTIDAD -->
<div class="col-md-6">
<div class="input-group">
<span class="input-group-text"><i class="fa fa-hashtag"></i></span>
<input type="number" id="cantidad" class="form-control" placeholder="Cantidad">
</div>
</div>

<!-- LOTE -->
<div class="col-md-6">
<div class="input-group">
<span class="input-group-text"><i class="fa fa-tag"></i></span>
<input type="text" id="lote" class="form-control" placeholder="Lote">
</div>
</div>

<!-- UBICACIÓN -->
<div class="col-md-6">
<div class="input-group">
<span class="input-group-text"><i class="fa fa-map-marker-alt"></i></span>
<input type="text" id="ubicacion" class="form-control" placeholder="Ubicación">
</div>
</div>

<!-- OBS -->
<div class="col-md-12">
<textarea id="obs" class="form-control" placeholder="Observaciones"></textarea>
</div>

</div>

<button class="btn btn-primary w-100 mt-4">Guardar</button>

<div id="mensaje" class="mt-3"></div>

</form>

</div>

</div>

<script src="js/main.js"></script>
</body>
</html>
