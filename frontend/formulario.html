<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Captura - Sistema Inventario</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="sidebar">
  <h4>📦 Inventario</h4>
  <a href="index.html"><i class="fa fa-tachometer-alt"></i> Dashboard</a>
  <a href="formulario.html"><i class="fa fa-pen"></i> Captura</a>
  <a href="consultas.html"><i class="fa fa-table"></i> Consultas</a>
</div>

<div class="content">

<h3 class="mb-4"><i class="fa fa-pen"></i> Captura de Movimientos</h3>

<!-- STATS DINÁMICOS -->
<div class="row mb-4">
  <div class="col-md-4">
    <div class="stat-card">
      <h5><i class="fa fa-exchange-alt"></i> Movimientos</h5>
      <h3 id="movimientos">0</h3>
    </div>
  </div>
  <div class="col-md-4">
    <div class="stat-card">
      <h5><i class="fa fa-box"></i> Productos</h5>
      <h3 id="productos">0</h3>
    </div>
  </div>
  <div class="col-md-4">
    <div class="stat-card">
      <h5><i class="fa fa-exclamation-triangle"></i> Alertas</h5>
      <h3 id="alertas">0</h3>
    </div>
  </div>
</div>

<div class="card p-4">
  <h4 class="mb-4 text-white">Registrar Movimiento</h4>
  
  <form id="formMovimiento">
    <div class="row g-3">
      
      <!-- SUCURSAL (A o B) -->
      <div class="col-md-6">
        <div class="input-group">
          <span class="input-group-text"><i class="fa fa-building"></i></span>
          <select id="sucursal" class="form-control" required>
            <option value="">Seleccionar Sucursal</option>
            <option value="A">Sucursal A</option>
            <option value="B">Sucursal B</option>
          </select>
        </div>
      </div>
      
      <!-- ALMACÉN (solo lectura, se asigna automáticamente) -->
      <div class="col-md-6">
        <div class="input-group">
          <span class="input-group-text"><i class="fa fa-warehouse"></i></span>
          <input type="text" id="almacen" class="form-control" readonly disabled placeholder="Selecciona sucursal primero">
        </div>
      </div>
      
      <!-- TIPO MOVIMIENTO -->
      <div class="col-md-6">
        <div class="input-group">
          <span class="input-group-text"><i class="fa fa-exchange-alt"></i></span>
          <select id="tipo" class="form-control" required>
            <option value="">Seleccionar Tipo</option>
            <option value="Entrada">📥 Entrada</option>
            <option value="Salida">📤 Salida</option>
          </select>
        </div>
      </div>
      
      <!-- PRODUCTO CON AUTOCOMPLETE -->
      <div class="col-md-6 position-relative">
        <div class="input-group">
          <span class="input-group-text"><i class="fa fa-box"></i></span>
          <input type="text" id="producto" class="form-control" placeholder="Buscar producto..." autocomplete="off" required>
        </div>
        <div id="sugerencias" class="autocomplete-box"></div>
      </div>
      
      <!-- CANTIDAD -->
      <div class="col-md-6">
        <div class="input-group">
          <span class="input-group-text"><i class="fa fa-hashtag"></i></span>
          <input type="number" id="cantidad" class="form-control" placeholder="Cantidad" required>
        </div>
      </div>
      
      <!-- LOTE -->
      <div class="col-md-6">
        <div class="input-group">
          <span class="input-group-text"><i class="fa fa-tag"></i></span>
          <input type="text" id="lote" class="form-control" placeholder="Lote (opcional)">
        </div>
      </div>
      
      <!-- UBICACIÓN -->
      <div class="col-md-6">
        <div class="input-group">
          <span class="input-group-text"><i class="fa fa-map-marker-alt"></i></span>
          <input type="text" id="ubicacion" class="form-control" placeholder="Ubicación (opcional)">
        </div>
      </div>
      
      <!-- FECHA INGRESO (solo para entrada) -->
      <div class="col-md-6" id="divFechaIngreso" style="display: none;">
        <div class="input-group">
          <span class="input-group-text"><i class="fa fa-calendar"></i></span>
          <input type="date" id="fechaingreso" class="form-control">
        </div>
      </div>
      
      <!-- OBSERVACIONES -->
      <div class="col-md-12">
        <textarea id="obs" class="form-control" rows="2" placeholder="Observaciones (opcional)"></textarea>
      </div>
    </div>
    
    <button type="submit" class="btn btn-primary w-100 mt-4">
      <i class="fa fa-save"></i> Guardar Movimiento
    </button>
    
    <div id="mensaje" class="mt-3"></div>
  </form>
</div>

</div>

<script src="js/api.js"></script>
<script src="js/formulario.js"></script>
</body>
</html>
